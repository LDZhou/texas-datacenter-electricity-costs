# PyPSA-USA Base Config — ll=v1.0 (transmission locked at current capacity)
# Year placeholders are replaced at runtime by: python -m paper_pipeline.scripts.generate_runtime_config
# DO NOT edit YEAR_PLACEHOLDER values directly.

run:
  name: "vopt_YEAR_PLACEHOLDER"
  disable_progressbar: false
  shared_resources: true
  shared_cutouts: true
  validation: true

scenario:
  interconnect: [texas]
  clusters: [185]
  simpl: [500]
  opts: [3h]
  ll: [vopt]
  sector: ""
  planning_horizons: [YEAR_PLACEHOLDER]
foresight: 'perfect'

model_topology:
  transmission_network: 'tamu'
  topological_boundaries: 'county'
  interface_transmission_limits: false
  include:
  aggregate:

enable:
  build_cutout: false

renewable_weather_years: [YEAR_PLACEHOLDER]
renewable_scenarios: [historical]

renewable:
  dataset: atlite

snapshots:
  start: "YEAR_PLACEHOLDER-05-01"
  end: "YEAR_PLACEHOLDER-10-31"
  inclusive: "left"

electricity:
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste]
  renewable_carriers: [onwind, offwind_floating, solar, hydro]
  retirement: technical
  honor_planned_retirements: false
  SAFE_reservemargin: 0.14

  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres: 0.02
    contingency: 4000

  extendable_carriers:
    Generator: [OCGT, CCGT, solar, onwind]
    StorageUnit: [4hr_battery_storage]
    Store: []
    Link: []

  demand:
    profile: eia
    scenario:
      efs_case: reference
      efs_speed: moderate
      aeo: reference

  demand_response:
    shift: 0
    marginal_cost: 999999

conventional:
  unit_commitment: false
  must_run: false
  dynamic_fuel_price:
    enable: true
    pudl: true
    wholesale: true

lines:
  s_max_pu: 0.85
  s_nom_max: .inf
  max_extension: 5000
  length_factor: 1.25

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000

co2:
  storage: false
  network:
    enable: false
    capital_cost: 2736000
    marginal_cost: 4
    lifetime: 40
    discount_rate: 0.07

dac:
  enable: false
  granularity: "node"
  capital_cost: 6000000
  electricity_input: 2.5
  lifetime: 20
  discount_rate: 0.07

costs:
  atb:
    model_case: "Market"
    scenario: "Moderate"
  aeo:
    scenario: "reference"
  social_discount_rate: 0.02
  ng_fuel_year: YEAR_PLACEHOLDER
  emission_prices:
    enable: false
    co2: 0.
    co2_monthly_prices: false
  ptc_modifier:
    onwind: 27.50
    biomass: 27.50
  itc_modifier:
    solar: 0.3
    offwind: 0.3
    offwind_floating: 0.3
    EGS: 0.3
    geothermal: 0.3
    SMR: 0.3
    nuclear: 0.3
    hydro: 0.3
    2hr_battery_storage: 0.3
    4hr_battery_storage: 0.3
    6hr_battery_storage: 0.3
    8hr_battery_storage: 0.3
    10hr_battery_storage: 0.3
    8hr_PHS: 0.3
    10hr_PHS: 0.3
    12hr_PHS: 0.3
  min_year:
    hydrogen_ct: 2040
  max_growth:

clustering:
  simplify_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
    feature: solar+onwind-time
  cluster_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
    consider_efficiency_classes: false
  aggregation_strategies:
    generators:
      build_year: 'capacity_weighted_average'
      lifetime: 'capacity_weighted_average'
      start_up_cost: 'capacity_weighted_average'
      min_up_time: 'capacity_weighted_average'
      min_down_time: 'capacity_weighted_average'
      ramp_limit_up: max
      ramp_limit_down: max
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  temporal:
    resolution_elec: 3
    resolution_sector: false

focus_weights:

solving:
  options:
    load_shedding: 5000
    clip_p_max_pu: 1.e-2
    noisy_costs: true
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 0
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true

  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    gurobi-default:
      threads: 16
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol: 1.e-4
      OptimalityTol: 1.e-3
      FeasibilityTol: 1.e-3
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200

  mem: 64000
  walltime: "12:00:00"

walltime:
  build_renewable_profiles: '04:00:00'
  build_fuel_prices: '00:20:00'
  add_demand: '02:00:00'
  add_electricity: '04:00:00'
  simplify_network: '05:00:00'
  cluster_network: '04:00:00'
  solve_network: '20:00:00'

custom_files:
  activate: false
  files_path: ''
  network_name: ''
